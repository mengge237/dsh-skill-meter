# ============================================================================
# dsh-skill-meter —— DSH bundle patch
# ============================================================================
# 把 skill 状态挂件插进 Web profile 的配置树。与 whale 挂件同一种形态：
# 一个 webServer 插件，注册路由 + 往 index.html 里塞一个 script。
#
# 安装（装完重启 dsh web 才加载）：
#   dsh plugin --profile web add dsh-skill-meter
# 从本地源码开发时改成装目录（路径按自己的机器写）：
#   dsh plugin --profile web add "<仓库根>/plugins/dsh-skill-meter"
# 卸载：
#   dsh plugin --profile web remove dsh-skill-meter
# ============================================================================

- insert:
    - id: dsh-skill-meter
      name: dsh-skill-meter
